    <rect x="-95" y="-95" width="190" height="190" rx="42" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <g transform="scale(0.92)"><path d="M 0 -46 C 6 -14 14 -6 46 0 C 14 6 6 14 0 46 C -6 14 -14 6 -46 0 C -14 -6 -6 -14 0 -46 Z" fill="#fff"/></g>
