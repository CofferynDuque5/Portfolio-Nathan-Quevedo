  <circle cx="650" cy="120" r="150" fill="#ffffff" fill-opacity="0.12" filter="url(#blur)"/>
  <circle cx="120" cy="430" r="140" fill="#000000" fill-opacity="0.10" filter="url(#blur)"/>
